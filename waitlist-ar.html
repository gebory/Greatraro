<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قائمة الانتظار — RARO</title>
<link rel="icon" href="Images/Logo/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Jost:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0a0806; --gold: #c9a256; --gold-dim: #9f8757;
    --cream: #d8d0c5; --cream-dim: #a89d8c; --line: rgba(201,162,86,.14); --line-strong: rgba(201,162,86,.3);
    --display: 'Cinzel', serif; --body: 'Jost', sans-serif; --mono: 'Space Mono', monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--black); color:var(--cream); font-family:var(--body); font-weight:300; min-height:100vh; }
  a{ color:inherit; }
  ::selection{ background:var(--gold); color:#0a0806; }

  .topbar{ position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:22px 32px; mix-blend-mode:difference; }
  .topbar-mark{ font-family:var(--display); letter-spacing:4px; font-size:15px; color:var(--gold); text-decoration:none; direction:ltr; }
  .lang-switch{ font-family:var(--mono); font-size:11px; letter-spacing:2px; direction:ltr; }
  .lang-switch a{ text-decoration:none; color:var(--cream); opacity:.6; }
  .lang-switch a.active{ opacity:1; color:var(--gold); }

  .reveal{ opacity:0; transform:translateY(30px); transition:opacity .9s ease, transform .9s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(20px);} to{ opacity:1; transform:translateY(0);} }

  .hero{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:140px 32px; }
  .archive-number{ font-family:var(--mono); font-size:13px; letter-spacing:6px; color:var(--gold-dim); margin-bottom:34px; direction:ltr; opacity:0; animation:fadeUp 1s ease forwards .1s; }
  .page-title{ font-family:var(--display); font-weight:500; font-size:clamp(34px,7vw,60px); color:var(--cream); margin-bottom:44px; opacity:0; animation:fadeUp 1s ease forwards .25s; }
  .hero-text{ max-width:520px; font-size:18px; line-height:2.1; color:var(--cream-dim); opacity:0; animation:fadeUp 1s ease forwards .4s; }

  .waitlist-button{ display:inline-block; margin-top:70px; padding:20px 48px; border:1px solid var(--line-strong); color:var(--gold); text-decoration:none; font-family:var(--mono); font-size:13px; position:relative; overflow:hidden; transition:color .4s; opacity:0; animation:fadeUp 1s ease forwards .55s; }
  .waitlist-button::before{ content:""; position:absolute; inset:0; background:var(--gold); transform:translateY(101%); transition:transform .45s cubic-bezier(.7,0,.2,1); z-index:-1; }
  .waitlist-button:hover{ color:#0a0806; }
  .waitlist-button:hover::before{ transform:translateY(0); }

  .instagram{ margin-top:100px; opacity:0; animation:fadeUp 1s ease forwards .7s; }
  .instagram-title{ font-family:var(--mono); font-size:12px; letter-spacing:3px; color:var(--gold-dim); margin-bottom:16px; }
  .instagram-link{ color:var(--cream); text-decoration:none; font-size:17px; direction:ltr; display:inline-block; }
  .instagram-link:hover{ color:var(--gold); }

  .navigation{ padding:0 0 90px; text-align:center; }
  .navigation a{ font-family:var(--mono); font-size:13px; text-decoration:none; color:var(--gold); opacity:.85; }
  .navigation a:hover{ opacity:1; }
</style>
</head>
<body>

<div class="topbar">
  <a href="index-ar.html" class="topbar-mark">RARO</a>
  <div class="lang-switch">
    <a href="waitlist.html">EN</a> / <a href="waitlist-ar.html" class="active">AR</a>
  </div>
</div>

<section class="hero">
  <div class="archive-number">07</div>
  <div class="page-title">قائمة الانتظار</div>
  <div class="hero-text">
    ينتهي الأرشيف هنا.<br><br>
    في الوقت الحالي.<br><br>
    العلامة التالية لم تُكشف بعد.<br><br>
    انضم إلى قائمة الانتظار ليصلك إشعار عند وصول الفصل التالي.
  </div>
  <a href="https://wa.me/9647724633842?text=مرحباً%20RARO،%20أرغب%20بالانضمام%20إلى%20قائمة%20الانتظار." target="_blank" class="waitlist-button">الانضمام إلى قائمة الانتظار</a>
  <div class="instagram">
    <div class="instagram-title">إنستغرام</div>
    <a href="https://instagram.com/964raro" class="instagram-link">@964raro</a>
  </div>
</section>

<div class="navigation reveal">
  <a href="echo-ar.html">ECHO →</a>
</div>

<script>
  document.querySelectorAll('.reveal').forEach(el=> el.classList.add('in'));
</script>

</body>
</html>
